<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>⚔ Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #ccc; font-family: system-ui, sans-serif; min-height: 100dvh; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    h1 { color: #a78bfa; font-size: 20px; text-align: center; }
    .banner { display: none; background: #7f1d1d; color: #fca5a5; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    .banner.visible { display: block; }
    .panel { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px; }
    .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
    .bar-wrap { background: #222; border-radius: 8px; overflow: hidden; height: 16px; margin: 6px 0; cursor: pointer; }
    .bar { height: 100%; border-radius: 8px; transition: width 150ms linear; }
    .fate-bar { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
    .energy-bar { background: linear-gradient(90deg, #0369a1, #38bdf8); }
    .energy-bar.full { background: linear-gradient(90deg, #15803d, #4ade80); }
    .time-label { text-align: center; font-size: 12px; color: #666; margin-top: 3px; }
    .action-btn { height: 50%; width: 100%; padding: 50px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; background: #1d4ed8; color: white; transition: opacity 200ms; }
    .action-btn:disabled { opacity: 0.3; cursor: default; }
    .sub-btns { display: flex; gap: 8px; margin-top: 8px; }
    .sub-btn { flex: 1; padding: 38px 14px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: opacity 200ms; }
    .sub-btn:disabled { opacity: 0.3; cursor: default; }
    .btn-bonus { background: #0f4c75; color: #7dd3fc; }
    .btn-react { background: #1e3a5f; color: #93c5fd; }
    .leave-btn { position: fixed; bottom: 6px; left: 10px; padding: 4px; font-size: 20px; color: #333; text-decoration: none; cursor: pointer; background: none; border: none; }
    .error-msg { background: #7f1d1d; color: #fca5a5; text-align: center; padding: 20px; border-radius: 10px; font-weight: bold; font-size: 16px; margin: 40px auto; max-width: 360px; }
    .mini-section-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin: 8px 0 4px; }
    .mini-section-label:first-child { margin-top: 0; }
    .mini-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .mini-name { font-size: 11px; color: #888; min-width: 80px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-bar-wrap { flex: 1; background: #222; border-radius: 3px; overflow: hidden; height: 7px; }
    .mini-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0369a1, #38bdf8); }
    .mini-bar.full { background: linear-gradient(90deg, #15803d, #4ade80); }
    .mini-time { font-size: 10px; color: #555; min-width: 30px; text-align: right; }
  </style>
</head>
<body>
  <div id="banner" class="banner">⚡ Timers Paused</div>
  <h1 id="player-name">⚔</h1>

  <div id="fate-panel" class="panel" style="display:none">
    <div class="panel-title">⚡ Fate Timer</div>
    <div class="bar-wrap"><div id="fate-bar" class="bar fate-bar" style="width:100%"></div></div>
    <div id="fate-time" class="time-label">30s</div>
  </div>

  <div id="player-panel" class="panel" style="display:none">
    <div class="panel-title">Your Timer</div>
    <div class="bar-wrap" id="energy-wrap">
      <div id="energy-bar" class="bar energy-bar" style="width:0%"></div>
    </div>
    <div id="energy-time" class="time-label">0s / 15s</div>
    <button id="action-btn" class="action-btn" disabled onclick="sendAction('tap:action')">ACTION</button>
    <div class="sub-btns">
      <button id="bonus-btn" class="sub-btn btn-bonus" disabled onclick="sendAction('tap:bonus')">Bonus / Move</button>
      <button id="react-btn" class="sub-btn btn-react" disabled onclick="sendAction('tap:react')">React</button>
    </div>
  </div>

  <div id="all-timers" class="panel" style="display:none">
    <div class="panel-title">All Timers</div>
    <div id="mini-list"></div>
  </div>

  <button class="leave-btn" onclick="leave()">Leave Combat</button>

  <script src="/shared.js"></script>
  <script>
    const rawName = location.pathname.replace(/^\/player\//, '')
    const playerName = decodeURIComponent(rawName)

    // Validate player name: must be non-empty and contain only safe characters
    const VALID_NAME = /^[A-Za-z0-9 _'\-\.]{1,64}$/
    if (!playerName || !VALID_NAME.test(playerName)) {
      document.body.innerHTML = '<div class="error-msg">Invalid player name. Please <a href="/" style="color:#fca5a5">go back</a> and enter a valid name.</div>'
    } else {
      document.getElementById('player-name').textContent = '⚔ ' + playerName

      let playerEntity = null
      let getWs
      let lastMiniSig = ''

      function fmt(s) { return Math.max(0, s).toFixed(1) + 's' }
      function pct(cur, dur) { return Math.min(100, (cur / dur) * 100) }
      function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
      function miniSig(entities) { return entities.map(e => e.id + ':' + e.type).join(',') }

      function miniRowHTML(e) {
        return `<div class="mini-row" id="mrow-${escapeHtml(e.id)}">
          <span class="mini-name">${escapeHtml(e.name)}</span>
          <div class="mini-bar-wrap"><div id="mbar-${escapeHtml(e.id)}" class="mini-bar" style="width:0%"></div></div>
          <span id="mtime-${escapeHtml(e.id)}" class="mini-time">0s</span>
        </div>`
      }

      function miniGroupHTML(label, entities) {
        if (!entities.length) return ''
        return `<div class="mini-section-label">${label}</div>` + entities.map(miniRowHTML).join('')
      }

      function rebuildMini(entities) {
        document.getElementById('mini-list').innerHTML =
          miniGroupHTML('Monsters', entities.filter(e => e.type === 'monster')) +
          miniGroupHTML('Minions', entities.filter(e => e.type === 'minion')) +
          miniGroupHTML('Players', entities.filter(e => e.type === 'player'))
      }

      function updateMini(entities) {
        entities.forEach(e => {
          if (!e || !e.timer || e.timer.current == null || e.timer.duration == null) return
          const p = pct(e.timer.current, e.timer.duration)
          const bar = document.getElementById('mbar-' + e.id)
          const time = document.getElementById('mtime-' + e.id)
          if (bar) { bar.style.width = p + '%'; bar.className = 'mini-bar' + (p >= 100 ? ' full' : '') }
          if (time) time.textContent = fmt(e.timer.current)
        })
      }

      function send(action) {
        const ws = getWs ? getWs() : null
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(action))
      }
      function sendAction(type) { if (playerEntity) send({ type, id: playerEntity.id }) }

      function render(state) {
        if (!state || !state.fate) return
        document.getElementById('fate-panel').style.display = ''
        document.getElementById('banner').classList.toggle('visible', state.fatePaused || state.dmPaused)
        const fp = pct(state.fate.current, state.fate.duration)
        document.getElementById('fate-bar').style.width = fp + '%'
        document.getElementById('fate-time').textContent = fmt(state.fate.current)

        playerEntity = state.entities.find(e => e.name === playerName && e.type === 'player') ?? null
        const panel = document.getElementById('player-panel')

        if (playerEntity && playerEntity.timer && playerEntity.timer.current != null && playerEntity.timer.duration != null) {
          panel.style.display = ''
          const p = pct(playerEntity.timer.current, playerEntity.timer.duration)
          const bar = document.getElementById('energy-bar')
          bar.style.width = p + '%'
          bar.className = 'bar energy-bar' + (p >= 100 ? ' full' : '')
          document.getElementById('energy-time').textContent = fmt(playerEntity.timer.current) + ' / ' + fmt(playerEntity.timer.duration)
          document.getElementById('action-btn').disabled = p < 100
          document.getElementById('bonus-btn').disabled = p < 50
          document.getElementById('react-btn').disabled = p < 25
        } else {
          panel.style.display = 'none'
        }

        const allTimers = document.getElementById('all-timers')
        const others = state.entities.filter(e => !(e.name === playerName && e.type === 'player'))
        if (others.length) {
          allTimers.style.display = ''
          const sig = miniSig(others)
          if (sig !== lastMiniSig) { rebuildMini(others); lastMiniSig = sig }
          else { updateMini(others) }
        } else {
          allTimers.style.display = 'none'
        }
      }

      function leave() {
        send({ type: 'player:leave', name: playerName })
        location.href = '/'
      }


      getWs = connect(function(getState) {
        animate(getState, render)
      })
    }
  </script>
</body>
</html>
